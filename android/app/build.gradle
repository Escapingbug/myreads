apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace = "io.myreads.app"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId "io.myreads.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (project.findProperty('appVersionCode') ?: appVersion.androidVersionCode).toInteger()
        versionName = (project.findProperty('appVersionName') ?: appVersion.version).toString()
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!normalizer:!silero_vad_16k_op15.onnx'
        }
    }
    buildFeatures { buildConfig = true }
    defaultConfig { buildConfigField "String", "LITERT_VERSION", '"2.2.0"' }
    packaging { jniLibs { useLegacyPackaging = true } }
    signingConfigs {
        if (signingPath) {
            publication {
                storeFile file(signingPath)
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingPath) signingConfig signingConfigs.publication
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.all {
            if (project.hasProperty('ttsNativePath')) {
                systemProperty 'java.library.path', project.property('ttsNativePath')
                systemProperty 'tts.native', 'true'
            }
            ['ttsModelRoot', 'ttsReferenceRoot', 'ttsParityOutput', 'bertModelRoot', 'bertTestOutput'].each { key ->
                if (project.hasProperty(key)) systemProperty key, project.property(key)
            }
        }
    }
}
kotlin { jvmToolchain(21) }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    // Historical MOSS parity fixtures run on the host only.
    testImplementation 'com.microsoft.onnxruntime:onnxruntime:1.23.2'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation 'com.github.houbb:pinyin:0.4.0'
    implementation 'com.google.ai.edge.litert:litert:2.2.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
