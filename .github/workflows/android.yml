name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - run: npm test
      - run: npm run native:sync
      - name: Build historical host text fixtures
        run: |
          cmake -S android/app/src/main/cpp -B artifacts/tts-native -DCMAKE_BUILD_TYPE=Release
          cmake --build artifacts/tts-native --target zijian_tokenizer -j 4
      - name: Verify Android tests and APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug -PttsNativePath="$GITHUB_WORKSPACE/artifacts/tts-native" --console=plain
      - name: Verify Audio8 real weights on the host CPU
        run: |
          python3 -m venv artifacts/audio8-venv
          artifacts/audio8-venv/bin/pip install -r tools/audio8/requirements.txt
          python3 scripts/fetch-tts-model.py artifacts/audio8-model
          artifacts/audio8-venv/bin/python scripts/verify-audio8-model.py artifacts/audio8-model artifacts/audio8-host
      - name: Check packaged Android regex compatibility
        run: |
          python3 scripts/verify-tts-regex.py android/app/build/outputs/apk/debug/app-debug.apk --dexdump "$ANDROID_HOME/build-tools/36.0.0/dexdump"
          python3 scripts/verify-tts-engine.py android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk
      - name: Keep reviewable APK and host synthesis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audio8-verification
          retention-days: 7
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/test-results/testDebugUnitTest/
            artifacts/audio8-host/

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - name: Restore signing key
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          test -n "$ANDROID_SIGNING_KEY"
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/zijian.keystore"
          chmod 600 "$RUNNER_TEMP/zijian.keystore"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/zijian.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:release
      - name: Verify signing and release metadata
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify-tts-regex.py android/app/build/outputs/apk/release/app-release.apk --dexdump "$ANDROID_HOME/build-tools/36.0.0/dexdump"
          python3 scripts/verify-tts-engine.py android/app/build/outputs/apk/release/app-release.apk
          node scripts/prepare-release.mjs "$GITHUB_REF_NAME"
      - name: Publish release with complete assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/releases/$APP_VERSION.md"
          test -f "$NOTES"
          gh release create "$GITHUB_REF_NAME" release/zijian-*.apk release/update.json release/SHA256SUMS --draft --verify-tag --title "纸间 $GITHUB_REF_NAME" --notes-file "$NOTES"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Mirror complete release to Gitee when configured
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_TARGET_BRANCH: ${{ vars.GITEE_TARGET_BRANCH }}
        run: npm run release:gitee -- "$GITHUB_REF_NAME" --if-configured
      - name: Clean signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/zijian.keystore"
